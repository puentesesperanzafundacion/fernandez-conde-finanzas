name: Mantener Supabase activo

on:
  schedule:
    - cron: "17 9 */4 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verificar lectura mínima en Supabase
        env:
          SUPABASE_URL: https://cqdtlmzrxwbdhwotquoq.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_3y596I6RcWqZxesU8BRpnQ_ROqepyh_
        run: |
          response=$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            --header "Content-Type: application/json" \
            --data '{}' \
            "${SUPABASE_URL}/rest/v1/rpc/finance_keep_alive_v6")
          test "${response}" = "true"
